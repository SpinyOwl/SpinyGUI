<!DOCTYPE html>
<html>
<head>

        /* @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400&display=swap"); */
        @font-face {
            font-family: 'Roboto';
            font-style: normal;
            font-weight: 400;
            src: url(file:///D:/Roboto-Regular.ttf)
        }

        html, body {
            overflow: hidden;
        }
        :root {
            --winframe-width: 100%;

        }

            font-weight: 400;

            font-stretch: normal;
            font-size: 16px;
            padding: 0;
            margin: 0;
        }

        *::-webkit-scrollbar {
            /* width: 8px; */
            /* height: 8px; */
        }

        winframe {
            width: var(--winframe-width);
            height: var(--winframe-height);

            display: block;
        }

        /* styles from app */
        winframe,
        winframe * {
            border: 8px solid #8c8c8c;
            box-sizing: border-box; /* default behaviour */
            overflow: hidden; /* default behaviour */
        }

        winframe:hover,
        winframe *:hover {
            border: 8px solid #fc3131;
        }

        #t2 {

        }

</head>
